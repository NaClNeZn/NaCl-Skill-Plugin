name: Update External Skills

on:
  schedule:
    # Every Monday 03:00 UTC (= 11:00 Beijing time), GitHub may delay a few minutes
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Sync external skills
        run: python scripts/update_external_skills.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/external
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "chore: auto-update external bundled skills"
            git push
          fi
